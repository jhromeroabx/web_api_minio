version: '3.9'

services:
  miniowebapi:
    restart: always
    image: ${REGISTRY_IMAGE:-ghcr.io/jhromeroabx/web_api_minio}:${IMAGE_TAG:-unset}
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "7775:80"
      - "7773:443"
    networks:
      - minio-network

networks:
  minio-network:
    external: true
