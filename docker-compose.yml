version: '3.9'

services:
  miniowebapi:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "7775:80"
      - "7773:443"
    networks:
      - minio-network

networks:
  minio-network:
    external: true