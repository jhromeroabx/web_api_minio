# must be unique in a given SonarQube instance
sonar.projectKey=web-api-minio

# optional properties
sonar.projectName=web-api-minio
sonar.projectVersion=1.0

sonar.host.url=https://sonarqube.loasi.cloud

# .NET project layout
sonar.sources=.
sonar.exclusions=**/bin/**,**/obj/**
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=**/Properties/Resources.Designer.cs

# OpenCover report generated by the xUnit test project
sonar.cs.opencover.reportsPaths=tests/web_api_users.Tests/TestResults/Coverage/coverage.opencover.xml
