name: Publish Package

on:
  push:
    branches: [develope]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a publicar'
        required: true
        default: 'develope'
        type: string

env:
  REGISTRY: ghcr.io
  PROJECT_FILE: web_api_users.csproj

jobs:
  publish:
    name: Publicar imagen .NET en GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.sha }}

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Leer versión del .csproj
        id: meta
        shell: bash
        run: |
          VERSION=$(dotnet msbuild "$PROJECT_FILE" \
            -getProperty:Version)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versión inválida: $VERSION"
            exit 1
          fi

          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "Versión: $VERSION"
          echo "Imagen: $IMAGE"

      - name: Restaurar dependencias
        run: dotnet restore "$PROJECT_FILE"

      - name: Compilar aplicación
        run: dotnet build "$PROJECT_FILE" --configuration Release --no-restore

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Obtener SHA del código publicado
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:dev-${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max